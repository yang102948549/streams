<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스트림스 메트로 · 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--cream:#FBF1E2;--ink:#2B2A33;--muted:#8A8391;--blue:#3FA9E0;--orange:#F5921E;--lime:#8CC63F;--green:#2E9E63;--purple:#5B3F9E;--num:'Barlow Condensed','Pretendard',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard',sans-serif;background:#EFE4D2;color:var(--ink);background-image:radial-gradient(circle at 10% 0%,#fff7ea 0,transparent 45%),radial-gradient(circle at 90% 100%,#f7dcc0 0,transparent 45%)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}
.logo{display:flex;align-items:center;gap:18px;margin-bottom:8px}
.logo .pill{background:#fff;border:4px solid var(--ink);border-radius:999px;padding:6px 34px;font-weight:900;font-size:42px;letter-spacing:-1px}
.logo .pill small{display:block;font-size:16px;font-weight:700;letter-spacing:8px;line-height:1;margin-top:-2px}
.logo .rail{flex:1;height:10px;background:var(--ink);border-radius:5px;position:relative}
.logo .rail::before,.logo .rail::after{content:"";position:absolute;top:-3px;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
.logo .rail::before{left:18%}.logo .rail::after{left:62%}
.sub{color:var(--muted);font-size:18px;margin:6px 0 34px;font-weight:500}

#entry{min-height:100vh;padding:48px 64px;display:flex;flex-direction:column;align-items:center;justify-content:center}
#entry .logo{width:min(900px,100%)}
.ticket{width:min(560px,100%);background:#fff;border-radius:28px;box-shadow:0 16px 40px rgba(80,50,20,.15);overflow:hidden;display:grid;grid-template-columns:1fr 14px 180px}
.ticket .main{padding:34px 34px 30px;display:flex;flex-direction:column;gap:16px}
.ticket .perf{background:repeating-linear-gradient(180deg,#d8d0c4 0 10px,transparent 10px 20px);width:4px;margin:16px auto}
.ticket .stub{background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.ticket .stub .badge{width:64px;height:64px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font:800 34px var(--num)}
.ticket .stub .lbl{font-weight:800;font-size:15px;letter-spacing:1px}
.field{background:var(--cream);border-radius:14px;padding:10px 14px}
.field label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.field input{width:100%;border:0;background:transparent;font:700 24px 'Pretendard';color:var(--ink)}
.field input.code{font:800 34px var(--num);letter-spacing:10px}
.btn{width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:20px;background:var(--ink);color:#fff;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid #d8d0c4;font-size:15px;padding:10px}
.btn.rankbtn{background:rgba(255,255,255,.92);color:var(--ink);font-size:16px}
.btn.rankbtn:disabled{opacity:.5}
.btn.light{background:#fff;color:var(--ink)}
.err{font-size:13px;color:#c0392b;font-weight:600;min-height:16px}

#modal{position:fixed;inset:0;background:rgba(43,42,51,.45);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:50}
.mbox{width:min(420px,92vw);background:#fff;border-radius:24px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .3s cubic-bezier(.2,1.3,.4,1)}
.mbox h3{font-size:22px;font-weight:900;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.mbox h3 .ic{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 18px var(--num)}
.mbox p{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:16px}
.mbox .row{display:flex;gap:8px}.mbox .row .btn{font-size:16px;padding:12px}

#select{min-height:100vh;padding:48px 64px;display:flex;flex-direction:column}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:28px;flex:1}
.card{background:#fff;border-radius:28px;overflow:hidden;display:grid;grid-template-columns:1fr 250px;box-shadow:0 10px 30px rgba(80,50,20,.12);transition:transform .18s,box-shadow .18s;text-align:left}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(80,50,20,.18)}
.card .mini{background:var(--cream);padding:14px}.card .mini svg{width:100%;height:100%;display:block}
.card .side{padding:26px 24px;color:#fff;display:flex;flex-direction:column;gap:10px}
.card .side .badge{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);font:800 26px var(--num);display:grid;place-items:center}
.card .side h3{font-size:26px;font-weight:800;letter-spacing:-.5px}
.card .side p{font-size:15px;line-height:1.5;opacity:.92;flex:1}
.card .side .go{align-self:flex-start;background:#fff;color:var(--ink);border-radius:999px;padding:10px 22px;font-weight:800;font-size:16px}

#game{height:100vh;display:grid;grid-template-columns:1fr 430px;gap:24px;padding:24px 28px}
.board{background:#fff;border-radius:28px;box-shadow:0 10px 30px rgba(80,50,20,.12);display:flex;flex-direction:column;overflow:hidden;position:relative}
.board .mapwrap{flex:1;background:var(--cream);position:relative;min-height:0}
.board .mapwrap svg{width:100%;height:100%;display:block}
.status{position:absolute;top:18px;left:22px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);padding:10px 18px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.08);display:flex;align-items:center;gap:10px}
.status .dot{width:12px;height:12px;border-radius:50%;background:var(--blue)}
.back{position:absolute;top:18px;right:22px;display:flex;gap:8px}
.back button{background:rgba(255,255,255,.92);padding:10px 16px;border-radius:999px;font-weight:700;font-size:15px;color:var(--muted)}
.back button:hover{color:var(--ink)}
.back .resetBtn{color:#c0392b;background:#fff}
.back .resetBtn:hover{color:#a8321f}
.bigdraw{position:absolute;top:18px;left:50%;transform:translateX(-50%)}
.bigdraw .bigtile{width:150px;height:150px;font-size:80px}
.strip{display:flex;align-items:stretch;height:96px;background:#fff;border-top:6px solid var(--ink)}
.strip .train{width:96px;background:#B11E1F;position:relative;border-radius:0 48px 48px 0;margin:8px 4px 8px 0}
.strip .train::before{content:"";position:absolute;inset:14px 22px 14px 14px;background:#2e6fd6;border-radius:0 30px 30px 0;opacity:.9}
.strip .train::after{content:"";position:absolute;left:10px;bottom:-4px;right:30px;height:8px;background:var(--ink);border-radius:4px}
.strip .cells{flex:1;display:grid}
.strip .cell{display:flex;flex-direction:column;border-left:2px solid #d8d0c4}
.strip .cell .n{flex:1;display:grid;place-items:center;font:600 20px var(--num);color:#6b6574}
.strip .cell .v{flex:1.2;display:grid;place-items:center;font:800 24px var(--num);color:#fff;background:var(--ink)}
.strip .cell:nth-child(odd) .n{background:#e9e2d6}

.panel{border-radius:28px;padding:22px;color:#fff;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(80,50,20,.12);overflow:auto;position:relative}
.panel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,rgba(0,0,0,.18) 0 14px,transparent 14px 28px)}
.panel .head{display:flex;align-items:center;gap:12px;margin-left:6px}
.panel .head .rail{flex:1;height:6px;background:#fff;border-radius:3px}
.panel .head .pill{background:#fff;color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:4px 22px 4px 12px;display:flex;align-items:center;gap:10px}
.panel .head .badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font:800 16px var(--num)}
.panel .head .t{font-weight:900;font-size:22px;line-height:1}.panel .head .t small{display:block;font-size:10px;letter-spacing:5px;font-weight:700}
.box{background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px}
.box label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.box .nm{font-weight:800;font-size:22px}
.box .nm .tag{font-size:11px;background:var(--ink);color:#fff;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle}
.legend{background:rgba(0,0,0,.15);border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px}
.legend .tile{font:700 13px var(--num);background:#fff3c4;color:var(--ink);border-radius:6px;padding:3px 7px;border-bottom:3px solid #d9b15c}
.note{font-size:13px;line-height:1.45;opacity:.95;padding:0 4px}
.drawzone{background:#fff;color:var(--ink);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bigtile{width:104px;height:104px;border-radius:20px;background:linear-gradient(160deg,#fff6d5,#f3d98f);border-bottom:6px solid #c99a3a;display:grid;place-items:center;font:800 52px var(--num);color:var(--ink);box-shadow:0 8px 18px rgba(120,80,10,.2);text-align:center}
.bigtile.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.bigtile.empty{background:#f3eee4;border-bottom-color:#d8d0c4;color:#c2b9ad;font-size:36px}
.bigtile.special{font-size:22px;font-family:'Pretendard';font-weight:800;background:linear-gradient(160deg,#f5f0ff,#d8cdf5);border-bottom-color:#8b75c9}
.bigtile.special span{font:700 18px var(--num);opacity:.7}
.bigdraw .bigtile.special{font-size:30px}.bigdraw .bigtile.special span{font-size:28px}
.drawhint{font-size:13px;color:var(--muted);text-align:center;min-height:18px}
.history{background:rgba(0,0,0,.15);border-radius:14px;padding:10px 12px}
.history label{font-size:12px;font-weight:700;opacity:.85;display:block;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;min-height:24px}
.chip{font:700 14px var(--num);background:#fff;color:var(--ink);border-radius:6px;min-width:28px;padding:2px 6px;text-align:center}
.chip.x{background:#c9c3d3;text-decoration:line-through;color:#5a5466}.chip.s{background:#d8cdf5}
.prog{background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px}
.prog .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.prog .top b{font:800 26px var(--num)}
.prog .bar{height:10px;background:#eee7da;border-radius:5px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.plist{background:#fff;color:var(--ink);border-radius:14px;padding:6px 0;max-height:360px;overflow:auto}
.plist .row{display:grid;grid-template-columns:36px 1fr auto auto;gap:8px;align-items:center;padding:7px 14px;border-top:1px solid #f0eae0;font-size:15px}
.plist .row:first-child{border:0}
.plist .rank{font:800 18px var(--num);color:var(--muted);text-align:center}.plist .rank.top{color:var(--orange)}
.plist .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .st{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:#eee7da;color:#6b6574}
.plist .st.ok{background:#e3f5ea;color:var(--green)}
.plist .sc{font:800 22px var(--num);min-width:44px;text-align:right}
.plist .empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}

#rankModal{position:fixed;inset:0;background:rgba(43,42,51,.6);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:60}
.rankbox{width:min(760px,92vw);background:var(--cream);border-radius:32px;padding:56px 48px 48px;box-shadow:0 30px 70px rgba(0,0,0,.35);position:relative;text-align:center}
.rankClose{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--ink);font-size:20px;font-weight:700;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.rankTitle{font-size:20px;font-weight:800;letter-spacing:6px;color:var(--muted);margin-bottom:28px}
.rankList{display:flex;flex-direction:column;gap:18px}
.rankRow{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:24px;background:#fff;border-radius:22px;padding:18px 30px;box-shadow:0 8px 20px rgba(80,50,20,.1)}
.rankRow .medal{font:900 44px var(--num);line-height:1}
.rankRow .rname{font-weight:800;font-size:34px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankRow .rscore{font:900 46px var(--num)}
.rankRow.n1{background:linear-gradient(135deg,#FFE7A0,#FFD24C);transform:scale(1.06)}
.rankRow.n1 .medal,.rankRow.n1 .rscore{color:#8a5a00}
.rankRow.n2{background:linear-gradient(135deg,#F1F1F4,#D9D9E0)}
.rankRow.n2 .medal,.rankRow.n2 .rscore{color:#5c5c66}
.rankRow.n3{background:linear-gradient(135deg,#F3D8B8,#E0AE79)}
.rankRow.n3 .medal,.rankRow.n3 .rscore{color:#7a4a1a}
.rankEmpty{padding:40px 10px;color:var(--muted);font-size:18px;font-weight:600}
.ctl{display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="entry">
  <div class="logo"><div class="pill">스트림스<small>메트로</small></div><div class="rail"></div></div>
  <p class="sub" style="margin-bottom:24px">관리자용 · 게임을 시작하고 타일을 뽑습니다.</p>
  <div class="ticket">
    <div class="main">
      <div class="field"><label>표시 이름</label><input id="inName" placeholder="이름 (학생 화면에는 안 보임)" maxlength="12" autocomplete="off"></div>
      <div class="err" id="entryErr"></div>
      <button class="btn" id="enterBtn">시작하기</button>
    </div>
    <div class="perf"></div>
    <div class="stub"><div class="badge">M</div><div class="lbl">관리자</div></div>
  </div>
</section>

<div id="modal" class="hidden"><div class="mbox">
  <h3><span class="ic" id="mIc">!</span><span id="mTitle"></span></h3><p id="mText"></p>
  <div class="row"><button class="btn ghost" id="mCancel">취소</button><button class="btn" id="mOk">확인</button></div>
</div></div>

<div id="rankModal" class="hidden">
  <div class="rankbox">
    <button class="rankClose" id="rankClose">✕</button>
    <div class="rankTitle">현재 순위</div>
    <div id="rankList" class="rankList"></div>
  </div>
</div>

<section id="select" class="hidden">
  <div class="logo"><div class="pill">스트림스<small>메트로</small></div><div class="rail"></div></div>
  <p class="sub">노선도를 고르면 방이 열리고 학생들이 입장할 수 있습니다.</p>
  <div class="cards" id="cards"></div>
</section>

<section id="game" class="hidden">
  <div class="board">
    <div class="mapwrap">
      <svg id="map" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="status"><span class="dot" id="sdot"></span><span id="stext">-</span></div>
      <div class="bigdraw hidden" id="bigdraw"></div>
      <div class="back"><button id="resetBtn" class="resetBtn">⟲ 초기화</button><button id="backBtn">← 나가기</button></div>
    </div>
    <div class="strip"><div class="train"></div><div class="cells" id="strip"></div></div>
  </div>
  <aside class="panel" id="panel">
    <div class="head"><div class="rail"></div><div class="pill"><span class="badge" id="pbadge">A</span><div class="t">스트림스<small>메트로</small></div></div><div class="rail"></div></div>
    <div class="box"><label>관리자</label><div class="nm" id="pname"></div></div>
    <div class="legend"><span class="tile">1~10</span><span class="tile">11~19 ×2</span><span class="tile">20~30</span><span class="tile">★</span><span class="tile">제거</span><span class="tile">선택</span></div>
    <p class="note" id="pnote"></p>
    <div class="drawzone">
      <div id="aTileView"><div class="bigtile empty">?</div></div>
      <button class="btn" id="drawBtn">타일 뽑기 <span style="opacity:.6;font-size:13px">(Space)</span></button>
      <div class="drawhint" id="aHint"></div>
    </div>
    <div class="prog"><div class="top"><span style="font-weight:700;font-size:13px;color:var(--muted)" id="progLbl">배치 완료</span><b id="progNum">0 / 0</b></div><div class="bar"><i id="progBar"></i></div></div>
    <div class="ctl" id="ctl"></div>
    <div class="history"><label>뽑힌 타일 <span id="bagCnt"></span></label><div class="chips" id="aChips"></div></div>
  </aside>
</section>

<script>
/* =====================================================================
   Firebase 설정 — 본인 프로젝트 값으로 교체 (학생용 파일과 동일한 값).
   Authentication > 익명 로그인 활성화 (학생용 파일과 동일).

   [보안 모델] 관리자와 학생 모두 익명 로그인을 쓰므로 Firebase 규칙만으로는
   둘을 구분할 수 없습니다. 즉 이 앱의 보안 경계는 "관리자 페이지 URL을 아는가"
   하나뿐입니다 — admin.html 주소를 학생과 공유하지 마세요.
   개발자 도구를 다룰 줄 아는 사용자가 원한다면 이론상 데이터를 건드릴 수
   있다는 뜻이니, 그런 위험까지 막아야 한다면 이메일/비밀번호 로그인 방식으로
   되돌리는 걸 권해드립니다.

   { "rules": { "room": {
       ".read": "auth != null",
       "meta":    { ".write": "auth != null" },
       "draws":   { ".write": "auth != null" },
       "results": { ".write": "auth != null" },
       "private": { ".read": "auth != null", ".write": "auth != null" },
       "players": { ".write": "auth != null",
                    "$uid": { ".write": "auth.uid == $uid",
                    "values": { "$idx": { ".write": "auth.uid == $uid && !data.exists()" } } } }
   } } }
   ===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDDQ17TEDuCIlm3g6SlVYjYtuwzJKkYl1o",
  authDomain: "streams-4aaff.firebaseapp.com",
  databaseURL: "https://streams-4aaff-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "streams-4aaff",
  storageBucket: "streams-4aaff.firebasestorage.app",
  messagingSenderId: "560403657812",
  appId: "1:560403657812:web:b4ab7219f26c51e34ea9c1",
  measurementId: "G-1Y4GQ5RRFM"
};

const SCORE=[0,0,3,8,15,25,35,50,65,80,100,120,140,165,190,220,250,280,310,350,400];
const COLORS={blue:'#3FA9E0',orange:'#F5921E',lime:'#8CC63F',green:'#2E9E63',purple:'#5B3F9E'};
const S=(ox,oy,arr)=>arr.map(([x,y,f])=>({x:(x-ox)*2,y:(y-oy)*2,shared:f==='P'}));
const SCENARIOS={
  A:{panel:'#F28C1B',title:'한 줄 노선',cells:20,desc:'기본 스트림스. 파랑 노선 20개 역을 모두 채운 뒤 오름차순 구간마다 점수를 얻습니다.',
     stations:S(45,205,[[90,240],[145,240],[200,275],[200,330],[165,385],[130,455],[185,455],[235,495],[290,490],[320,440],[350,390],[350,335],[350,280],[405,270],[460,315],[500,355],[550,310],[605,265],[605,375],[605,430]]),

const $=id=>document.getElementById(id);
const sym=v=>v==='★'?'★':v;
const isWild=v=>v==='★';
function makeBag(){const b=[];for(let i=1;i<=10;i++)b.push(i);for(let i=11;i<=19;i++)b.push(i,i);for(let i=20;i<=30;i++)b.push(i);b.push('★','REMOVE','CHOICE');
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function activeIdxOf(sc,round){const s=new Set();sc.rounds[round].lines.forEach(l=>sc.lines.find(x=>x.id===l).idx.forEach(i=>s.add(i)));return [...s];}
const placeable=d=>d.tile!=='REMOVE';
function bestSplit(seq){
  const n=seq.length,dp=Array(n+1).fill(0),cut=Array(n+1).fill(0);
  for(let j=1;j<=n;j++){dp[j]=-1;let last=-Infinity,ok=true;
    for(let i=j;i>=1;i--){const v=seq[i-1];
      if(v===null||v===undefined)ok=false;else if(!isWild(v)){if(last!==-Infinity&&v>last)ok=false;last=v;}
      if(!ok)break;const cand=dp[i-1]+(SCORE[j-i+1]??0);if(cand>dp[j]){dp[j]=cand;cut[j]=i;}}
    if(dp[j]<0){dp[j]=dp[j-1];cut[j]=j;}}
  const segs=[];let j=n;while(j>0){segs.unshift([cut[j]-1,j-1]);j=cut[j]-1;}return {score:dp[n],segs};
}
function scoreLine(line,values){
  const vals=line.idx.map(i=>values[i]??null);
  if(!line.loop){const r=bestSplit(vals);return {score:r.score,runs:r.segs.map(([a,b])=>line.idx.slice(a,b+1))};}
  let best=null;for(let r=0;r<vals.length;r++){const rot=[...vals.slice(r),...vals.slice(0,r)],res=bestSplit(rot);
    if(!best||res.score>best.score)best={score:res.score,runs:res.segs.map(([a,b])=>Array.from({length:b-a+1},(_,k)=>line.idx[(r+a+k)%vals.length]))};}
  return best;
}

}

function renderMap(svg,sc,state){
  const st=sc.stations,act=state.active;
  let out=`<rect width="1200" height="620" fill="#FBF1E2"/><g opacity=".35" fill="none" stroke-linecap="round" stroke-width="60">
    <path d="M-40 120 C 300 60, 500 360, 900 300 S 1200 160, 1260 200" stroke="#F9DEC0"/><path d="M-40 520 C 250 460, 450 620, 760 540 S 1100 400, 1260 480" stroke="#CFE6F3"/><path d="M 780 -40 C 760 200, 940 320, 980 660" stroke="#F7E3A8"/></g>`;
  for(const line of sc.lines){const on=!act||line.idx.some(i=>act.has(i)),pts=line.idx.map(i=>st[i]);
    let d=pts.map((p,k)=>(k?'L':'M')+p.x+' '+p.y).join(' ');if(line.loop)d+=' Z';
    out+=`<path d="${d}" fill="none" stroke="${COLORS[line.id]}" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" opacity="${on?1:.28}"/>`;
    if(line.loop)for(let k=0;k<pts.length;k++){const a=pts[k],b=pts[(k+1)%pts.length],mx=(a.x+b.x)/2,my=(a.y+b.y)/2,ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
      out+=`<g transform="translate(${mx} ${my}) rotate(${ang})" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"><path d="M-9 -7 L-2 0 L-9 7 M2 -7 L9 0 L2 7"/></g>`;}}
  st.forEach((p,i)=>{const lines=sc.lines.filter(l=>l.idx.includes(i)),on=!act||act.has(i),col=p.shared?COLORS.purple:COLORS[lines[0].id];
    out+=`<circle cx="${p.x}" cy="${p.y}" r="31" fill="#fff" stroke="${col}" stroke-width="7" opacity="${on?1:.35}"/>`;});
  svg.innerHTML=out;
}
function buildStrip(sc){const n=sc.cells,el=$('strip');el.style.gridTemplateColumns=`repeat(${n},1fr)`;
  el.innerHTML=Array.from({length:n},(_,k)=>`<div class="cell"><div class="n">${k+1}</div><div class="v">${k?'+':''}${SCORE[k+1]}</div></div>`).join('');}
function tileHTML(d){
  if(d.tile==='REMOVE')return `<div class="bigtile special pop">제거<br><span>${d.removed.join(' · ')}</span></div>`;
  if(d.tile==='CHOICE')return `<div class="bigtile special pop">선택<br><span>${d.options.join(' / ')}</span></div>`;
  return `<div class="bigtile pop">${sym(d.tile)}</div>`;
}

async function enterRoom(){

  listen(roomRef().child('draws'),'value',s=>{A.draws=s.val()||{};Object.keys(A.draws).forEach(r=>{A.seqNext[r]=Math.max(A.seqNext[r]||0,drawsArr(+r).length);});render();});

  listen(roomRef().child('results'),'value',s=>{A.results=s.val()||{};render();});

function playerProgress(p,round){const need=drawsArr(round).filter(placeable).map(d=>d.seq),placed=(p.placed&&p.placed[round])||{};return {done:need.filter(s=>placed[s]!==undefined&&placed[s]!==null).length,need:need.length};}
function cellsToFill(){const act=activeIdxOf(A.sc,A.meta.round).length;return act-(A.key==='B'&&A.meta.round===1?2:0)-(A.key==='C'?2:0);}

function render(){
  if(!A.meta||!A.sc)return;

  const dot=$('sdot'),txt=$('stext');

  else if(m.phase==='play'){txt.textContent=`${sc.rounds.length>1?sc.rounds[round].label+' · ':''}${need} / ${toFill} 장 뽑음`;dot.style.background=COLORS.blue;}
  else if(m.phase==='between'){txt.textContent=`${sc.rounds[round].label} 채점 완료`;dot.style.background=COLORS.purple;}

  let done=0,total=players.length;

  $('bagCnt').textContent=`· 주머니 ${A.bag.length}장`;$('aChips').innerHTML=chipsHTML(round);

function drawExtra(bag){while(bag.length){const t=bag.pop();if(t==='REMOVE'||t==='CHOICE'){bag.splice(Math.floor(Math.random()*bag.length),0,t);continue;}return t;}return null;}
async function adminDraw(){
  if(A.drawing||$('drawBtn').disabled)return;const bag=[...A.bag];if(!bag.length)return;
  const t=bag.pop();let d;
  if(t==='REMOVE'){const a=drawExtra(bag),b=drawExtra(bag);d={tile:'REMOVE',removed:[a,b].filter(x=>x!==null)};}
  else if(t==='CHOICE'){const a=drawExtra(bag),b=drawExtra(bag);d={tile:'CHOICE',options:[a,b].filter(x=>x!==null)};}
  else d={tile:t};
  A.drawing=true;$('drawBtn').disabled=true;
  const round=A.meta.round,seq=Math.max(drawsArr(round).length,(A.seqNext[round]||0));
  A.seqNext[round]=seq+1; // 리스너가 늦어도 같은 seq를 재사용하지 않도록
  const upd={};upd[`draws/${round}/${seq}`]={...d,ts:Date.now()};upd['private/bag']=bag;
  try{await roomRef().update(upd);}
  catch(e){A.seqNext[round]=seq;await showErr('타일 전송 실패',e);}
  finally{A.drawing=false;render();}
}
$('drawBtn').onclick=adminDraw;
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!$('game').classList.contains('hidden')&&$('modal').classList.contains('hidden')){e.preventDefault();adminDraw();}});
async function gradeRound(){
  if(A.grading)return;A.grading=true;
  const m=A.meta,sc=A.sc,round=m.round,lines=sc.rounds[round].lines.map(id=>sc.lines.find(l=>l.id===id)),upd={};
  Object.entries(A.players).forEach(([id,p])=>{
    const values=[];Object.entries(p.values||{}).forEach(([k,v])=>values[+k]=v);
    const lr=lines.map(l=>({id:l.id,...scoreLine(l,values)}));
    const rounds={...((A.results[id]||{}).rounds||{})};rounds[round]={lines:lr,score:lr.reduce((a,x)=>a+x.score,0)};
    upd[`results/${id}`]={name:p.name,rounds,total:Object.values(rounds).reduce((a,r)=>a+r.score,0)};
  });
  upd['meta/phase']=round<sc.rounds.length-1?'between':'done';
  try{await roomRef().update(upd);}catch(e){await showErr('채점 실패',e);}
  finally{A.grading=false;}
}
async function nextRound(){
  const r=A.meta.round+1,upd={'meta/round':r,'meta/phase':'play'};if(A.sc.rounds[r].newBag)upd['private/bag']=makeBag();
  try{await roomRef().update(upd);}catch(e){await showErr('다음 라운드 시작 실패',e);}
}
function leave(){off();A.meta=null;A.sc=null;A.draws={};A.players={};A.results={};A.bag=[];A.seqNext={};A.drawing=false;A.grading=false;show('entry');}
$('backBtn').onclick=async()=>{if(await modal({title:'나가기',text:'게임은 그대로 유지됩니다. 다시 로그인하면 이어서 진행할 수 있어요.',icon:'M',okText:'나가기'}))leave();};
$('resetBtn').onclick=async()=>{
  if(!(await modal({title:'게임 초기화',text:'현재 진행 상황(학생 배치, 뽑은 타일, 점수)이 모두 삭제되고 처음부터 다시 시작합니다. 계속할까요?',icon:'!',okText:'초기화'})))return;
  try{
    await clearRoom();
    off();A.meta=null;A.sc=null;A.draws={};A.players={};A.results={};A.bag=[];A.seqNext={};A.drawing=false;A.grading=false;
    show('select');
  }catch(e){await showErr('초기화 실패',e);}
};
</script>
</body>
</html>
